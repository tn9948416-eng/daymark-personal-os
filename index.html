<script src="./supabase-config.js"></script>
<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const dateAdd=(date,days)=>{const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+days);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const dateObj=s=>new Date(s+'T12:00:00');
const fmt=(s,opts={day:'numeric',month:'short'})=>dateObj(s).toLocaleDateString('vi-VN',opts);
const dayNames=['CN','T2','T3','T4','T5','T6','T7'];
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaults=()=>({
  userName:'Người kiến tạo',xp:0,rewardKeys:[],page:'dashboard',theme:'light',
  tasks:[
    {id:uid(),title:'Ôn 25 từ vựng Aptis theo chủ đề',area:'English',priority:'high',due:today(),completed:false,estimate:30,created:today(),notes:'Tự đặt câu với từ mới.'},
    {id:uid(),title:'Làm 2 bài tập C++ / DSA',area:'IT',priority:'high',due:today(),completed:false,estimate:45,created:today(),notes:'Tự nghĩ thuật toán trước khi xem lời giải.'},
    {id:uid(),title:'Ôn Điện tử số và làm bài tập',area:'University',priority:'medium',due:today(),completed:false,estimate:45,created:today(),notes:''},
    {id:uid(),title:'Viết 5 câu tiếng Anh và tự sửa lỗi',area:'English',priority:'medium',due:dateAdd(today(),1),completed:false,estimate:20,created:today(),notes:''},
    {id:uid(),title:'Tổng kết điều đã học trong ngày',area:'Personal',priority:'low',due:today(),completed:false,estimate:10,created:today(),notes:''}
  ],
  habits:[
    {id:uid(),name:'Học tiếng Anh chủ động',icon:'🌱',color:'#e8e3ff',history:{}},
    {id:uid(),name:'Code / luyện tư duy',icon:'💻',color:'#e0f2ff',history:{}},
    {id:uid(),name:'Ôn lại bài trên lớp',icon:'📚',color:'#ffeddf',history:{}},
    {id:uid(),name:'Đọc sách 10 trang',icon:'📖',color:'#e2f5ed',history:{}}
  ],
  goals:[
    {id:uid(),title:'Aptis ESOL — chạm B1/B2',icon:'🌍',why:'Tiến bộ đều ở cả 4 kỹ năng, đặc biệt là Writing và Speaking.',deadline:'2026-11-30',progress:25,milestones:[{text:'Củng cố ngữ pháp nền tảng',done:true},{text:'Luyện từ vựng theo chủ đề',done:false},{text:'Luyện đề đủ 4 kỹ năng',done:false}]},
    {id:uid(),title:'Vững nền tảng C++ & DSA',icon:'🧠',why:'Tự phân tích được bài toán trước khi bắt đầu code.',deadline:'2027-03-01',progress:15,milestones:[{text:'Nắm chắc mảng, chuỗi, vector, map',done:true},{text:'Thành thạo đệ quy và quay lui',done:false},{text:'Học quy hoạch động cơ bản',done:false}]},
    {id:uid(),title:'Đạt kết quả tốt môn Điện tử số',icon:'⚡',why:'Hiểu bản chất, làm được bài tự luận và hướng tới điểm 8–9.',deadline:'2027-01-15',progress:20,milestones:[{text:'Nắm hệ đếm và mã hóa',done:false},{text:'Ôn cổng logic và đại số Boole',done:false},{text:'Luyện đề tổng hợp',done:false}]}
  ],
  journal:[],sessions:[],lastVisit:today(),
  brainNotes:[
    {id:uid(),title:'Cách học hiệu quả hơn',content:'• Học chủ động, không chỉ đọc lại.\n• Tự giải thích kiến thức bằng lời của mình.\n• Ôn lại theo khoảng cách và làm bài tập nhỏ.',tags:['Học tập','Phương pháp'],folder:'Ý tưởng',favorite:true,created:today(),updated:today()},
  ],
  rpg:{coins:0,claimed:{},redeemed:[],createdAt:today()},
  focusTimer:null,coachNotes:[],
});
let state;
const STORAGE_KEY='daymark-v2';
try{
  const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||localStorage.getItem('daymark-v1')||'null');
  state=saved?{...defaults(),...saved,rpg:{...defaults().rpg,...(saved.rpg||{})}}:defaults();
}catch(e){state=defaults()}
if(!Array.isArray(state.rewardKeys))state.rewardKeys=[];
if(!Array.isArray(state.brainNotes))state.brainNotes=[];
if(!Array.isArray(state.coachNotes))state.coachNotes=[];
if(!state.rpg||typeof state.rpg!=='object')state.rpg={coins:0,claimed:{},redeemed:[]};
if(!state.rpg.claimed)state.rpg.claimed={};
if(!Array.isArray(state.rpg.redeemed))state.rpg.redeemed=[];
let currentPage=state.page||'dashboard',taskFilter='today',taskSearch='',plannerOffset=0,timerMode=25*60,timerLeft=25*60,timerRunning=false,timerInterval=null,sessionStarted=0,timerDeadline=0,brainQuery='',brainFolder='Tất cả',coachQuestion='',coachReply='';
const pageNames={dashboard:'Tổng quan',tasks:'Công việc',planner:'Lịch tuần',habits:'Thói quen',goals:'Mục tiêu',focus:'Tập trung',reminders:'Nhắc việc',coach:'Trợ lý cục bộ',rpg:'Life RPG',brain:'Second Brain',journal:'Nhật ký',insights:'Phân tích thông minh',settings:'Cài đặt & dữ liệu'};
function save(){
  state.page=currentPage;
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
  catch(e){toast('Không thể lưu dữ liệu vào trình duyệt. Hãy kiểm tra chế độ riêng tư hoặc dung lượng lưu trữ.');}
  document.body.classList.toggle('dark',state.theme==='dark');
  updateChrome();
}
function toast(msg){const root=$('#toastRoot');root.innerHTML=`<div class="toast">${msg}</div>`;setTimeout(()=>root.innerHTML='',2600)}
function award(key,amount,msg){if(state.rewardKeys.includes(key))return;state.rewardKeys.push(key);state.xp=(state.xp||0)+amount;save();if(msg)toast(`✦ ${msg} <b>+${amount} XP</b>`)}
function level(){return Math.floor((state.xp||0)/100)+1}
function levelName(){const l=level();return l<3?'Người bắt đầu':l<5?'Người bền bỉ':l<8?'Người kỷ luật':l<12?'Người bứt phá':'Người kiến tạo'}
function doneToday(){return state.tasks.filter(t=>t.due===today()&&t.completed).length}
function todayTasks(){return state.tasks.filter(t=>t.due===today())}
function habitDone(h,day=today()){return !!h.history?.[day]}
function allHabitDone(day=today()){return state.habits.filter(h=>habitDone(h,day)).length}
function streak(){let n=0,d=today();if(!state.habits.some(h=>habitDone(h,d)))d=dateAdd(d,-1);for(let i=0;i<366;i++){const any=state.habits.some(h=>habitDone(h,d));if(!any)break;n++;d=dateAdd(d,-1)}return n}
function updateChrome(){
  $('#crumbPage').textContent=pageNames[currentPage]||'Tổng quan';
  $$('#mainNav button').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage));
  const open=state.tasks.filter(t=>!t.completed).length;$('#navTaskCount').textContent=open;const reminderCount=(state.tasks||[]).filter(t=>t.reminderAt&&!t.completed).length;const rb=$('#navReminderCount');if(rb)rb.textContent=reminderCount;
  $('#profileName').textContent=state.userName||'Người kiến tạo';$('#profileLevel').textContent=`Level ${level()} · ${levelName()}`;
  const q=Math.min(3,doneToday()+allHabitDone());$('#questProgress').textContent=`${q}/3` ;$('#questBar').style.width=(q/3*100)+'%';
}
function setPage(p){currentPage=p;save();render()}
function pageHead(kicker,title,sub,action=''){return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h1 class="page-title">${title}</h1><p class="page-sub">${sub}</p></div>${action}</div>`}
function taskCard(t,showActions=true){const reminder=t.reminderAt?`<span class="tag" style="background:#fff0e5;color:#b56a37">⏰ ${esc(localDateTimeLabel(t.reminderAt))}</span>`:'';return `<div class="task-row ${t.completed?'completed':''}" data-task="${t.id}"><button class="task-check ${t.completed?'done':''}" data-action="toggle-task" data-id="${t.id}" aria-label="Hoàn thành">${t.completed?'✓':''}</button><div class="task-copy"><div class="task-name">${esc(t.title)}</div><div class="task-detail"><span class="priority ${t.priority}"></span>${esc(t.area||'Khác')} <span>·</span> ${t.due===today()?'Hôm nay':fmt(t.due)} <span>·</span> ${t.estimate||25} phút ${reminder}</div></div>${showActions?`<div class="task-actions"><button class="mini-action" data-action="edit-task" data-id="${t.id}" title="Sửa">✎</button><button class="mini-action" data-action="delete-task" data-id="${t.id}" title="Xóa">×</button></div>`:''}</div>`}
function goalMini(g){return `<div class="goal-row"><div class="goal-top"><span class="goal-name">${esc(g.icon)} ${esc(g.title)}</span><span class="goal-percent">${g.progress}%</span></div><div class="bar"><span style="width:${g.progress}%"></span></div><div class="goal-bottom"><span>Hạn ${fmt(g.deadline)}</span><span>${g.milestones.filter(m=>m.done).length}/${g.milestones.length} cột mốc</span></div></div>`}
function renderDashboard(){
 const tasks=todayTasks(),done=tasks.filter(t=>t.completed).length,pct=tasks.length?Math.round(done/tasks.length*100):0;
 const now=new Date(),hour=now.getHours(),greet=hour<12?'Chào buổi sáng':hour<18?'Chào buổi chiều':'Chào buổi tối';
 const todayStr=now.toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'long'});
 const habitHtml=state.habits.slice(0,4).map(h=>{const last=Array.from({length:7},(_,i)=>dateAdd(today(),i-6));return `<div class="habit-item"><div class="habit-left"><div class="habit-icon" style="background:${h.color||'#f0edff'}">${esc(h.icon)}</div><div style="min-width:0"><div class="habit-name">${esc(h.name)}</div><div class="habit-sub">${h.history?.[today()]?'Đã hoàn thành hôm nay':'Giữ nhịp mỗi ngày'}</div></div></div><div style="display:flex;align-items:center"><div class="habit-days">${last.map(d=>`<span class="day-dot ${habitDone(h,d)?'on':''}" title="${fmt(d)}">${dayNames[dateObj(d).getDay()].replace('T','')}</span>`).join('')}</div><button class="habit-today ${habitDone(h)?'on':''}" data-action="toggle-habit" data-id="${h.id}" title="Đánh dấu hôm nay">${habitDone(h)?'✓':''}</button></div></div>`}).join('');
 const recent=tasks.slice(0,5).map(t=>taskCard(t)).join('');
 const focusMins=state.sessions.filter(s=>s.date===today()).reduce((a,s)=>a+s.minutes,0);
 return `<div class="page">
 <div class="dashboard-top"><section class="welcome"><div class="eyebrow">${todayStr}</div><h1>${greet}, ${esc(state.userName==='Người kiến tạo'?'người kiến tạo':(state.userName||'bạn').split(' ')[0])} ✨</h1><p>Tiến bộ không đến từ một ngày bùng nổ. Nó đến từ những lời hứa nhỏ mà bạn giữ được, kể cả khi không có ai nhìn thấy.</p><div class="welcome-bottom"><button class="primary-btn" data-goto="focus">Bắt đầu tập trung →</button><span class="tiny-note">Một bước nhỏ. Một ngày tốt hơn.</span></div></section>
 <section class="card"><div class="card-head"><div class="card-title">La bàn hôm nay</div><span class="card-meta">Tiến độ công việc</span></div><div class="progress-ring-wrap"><div class="ring" style="--deg:${pct*3.6}deg"><div class="ring-inner"><strong>${pct}%</strong><span>HOÀN THÀNH</span></div></div><div class="ring-copy"><h3>${pct===100?'Bạn đã làm được!':pct>=50?'Bạn đang đi đúng hướng':'Bắt đầu bằng một việc nhỏ'}</h3><p>${done}/${tasks.length} công việc hôm nay đã hoàn thành. Đừng cố làm tất cả cùng lúc — hãy làm việc quan trọng tiếp theo.</p></div></div><div class="mini-stats"><div class="mini-stat"><strong>${allHabitDone()}</strong><span>Thói quen xong</span></div><div class="mini-stat"><strong>${focusMins}m</strong><span>Tập trung hôm nay</span></div><div class="mini-stat"><strong>${state.xp||0}</strong><span>Tổng XP</span></div></div></section></div>
 <div class="stats-grid"><div class="stat-card"><div class="stat-ico" style="background:#eeebff">☑</div><div><div class="stat-value">${done}/${tasks.length}</div><div class="stat-label">Việc hoàn thành hôm nay</div><div class="stat-trend">${Math.max(0,tasks.length-done)} việc còn lại</div></div></div><div class="stat-card"><div class="stat-ico" style="background:#fff0e6">🔥</div><div><div class="stat-value">${streak()} ngày</div><div class="stat-label">Chuỗi ngày duy trì</div><div class="stat-trend" style="color:#e79a5c">Bền bỉ hơn mỗi ngày</div></div></div><div class="stat-card"><div class="stat-ico" style="background:#e6f7f0">✦</div><div><div class="stat-value">${state.xp||0} XP</div><div class="stat-label">Điểm kinh nghiệm</div><div class="stat-trend">Level ${level()} · ${levelName()}</div></div></div><div class="stat-card"><div class="stat-ico" style="background:#e9f3ff">◷</div><div><div class="stat-value">${Math.round(focusMins/60*10)/10}h</div><div class="stat-label">Thời gian tập trung</div><div class="stat-trend" style="color:#6a9fe5">Hôm nay</div></div></div></div>
 <div class="dashboard-main"><div class="stack"><section class="card"><div class="card-head"><div><div class="card-title">🎯 Việc cần làm hôm nay</div><div class="card-meta" style="margin-top:4px">Chọn 1 việc quan trọng, bắt đầu ngay.</div></div><button class="text-btn" data-goto="tasks">Xem tất cả →</button></div><div class="task-list">${recent||'<div class="empty"><div class="empty-ico">🌤️</div>Ngày hôm nay đang chờ bạn thiết kế.</div>'}</div><button class="soft-btn" style="width:100%;margin-top:10px" data-action="add-task">＋ Thêm một việc</button></section>
 <section class="card"><div class="card-head"><div><div class="card-title">✳ Vườn thói quen</div><div class="card-meta" style="margin-top:4px">Tưới một chút mỗi ngày, rồi bạn sẽ thấy mình lớn lên.</div></div><button class="text-btn" data-goto="habits">Quản lý →</button></div><div class="habit-list">${habitHtml||'<div class="empty">Hãy gieo thói quen đầu tiên của bạn.</div>'}</div></section></div>
 <div class="stack"><section class="card streak-card"><div class="card-head"><div class="card-title">🔥 Chuỗi kiên trì</div><span class="card-meta">Không cần hoàn hảo</span></div><div style="display:flex;align-items:flex-end;gap:10px"><div class="streak-big">${streak()}</div><div class="streak-caption">ngày liên tiếp<br>có hành động tích cực</div></div><div class="streak-week">${Array.from({length:7},(_,i)=>{let d=dateAdd(today(),i-6),active=state.habits.some(h=>habitDone(h,d));return `<div class="streak-day"><i class="${active?'active':''}">${active?'✦':'·'}</i>${dayNames[dateObj(d).getDay()]}</div>`}).join('')}</div></section>
 <section class="card"><div class="card-head"><div><div class="card-title">◎ Những vì sao dẫn đường</div><div class="card-meta" style="margin-top:4px">Mục tiêu lớn được tạo từ bước nhỏ.</div></div><button class="text-btn" data-goto="goals">Chi tiết →</button></div>${state.goals.slice(0,3).map(goalMini).join('')||'<div class="empty">Chưa có mục tiêu nào.</div>'}</section>
 <section class="card"><div class="card-head"><div class="card-title">🪄 Lời nhắc cho hôm nay</div></div><div style="font:700 14px 'Manrope';line-height:1.55;color:#4e5268">“Kỷ luật là cách bạn chăm sóc phiên bản tương lai của chính mình.”</div><div class="card-meta" style="margin-top:10px">Hãy làm ít hơn, nhưng làm điều quan trọng tốt hơn.</div></section></div></div></div>`;
}
function renderTasks(){const tasks=state.tasks.filter(t=>{if(taskFilter==='today'&&t.due!==today())return false;if(taskFilter==='upcoming'&&(t.due<=today()||t.completed))return false;if(taskFilter==='done'&&!t.completed)return false;if(taskFilter==='open'&&t.completed)return false;if(taskSearch&&!(`${t.title} ${t.area}`).toLowerCase().includes(taskSearch.toLowerCase()))return false;return true}).sort((a,b)=>a.due.localeCompare(b.due));

 return `<div class="page">${pageHead('MAKE IT HAPPEN','Không gian công việc','Đưa suy nghĩ ra khỏi đầu và biến chúng thành những bước có thể hoàn thành.', '<button class="primary-btn" data-action="add-task">＋ Thêm công việc</button>')}<div class="toolbar" style="margin-bottom:16px"><input class="search-input" id="taskSearch" placeholder="⌕  Tìm công việc..." value="${esc(taskSearch)}"><button class="filter-btn ${taskFilter==='today'?'active':''}" data-filter="today">Hôm nay</button><button class="filter-btn ${taskFilter==='open'?'active':''}" data-filter="open">Chưa xong</button><button class="filter-btn ${taskFilter==='upcoming'?'active':''}" data-filter="upcoming">Sắp tới</button><button class="filter-btn ${taskFilter==='done'?'active':''}" data-filter="done">Đã xong</button><button class="filter-btn ${taskFilter==='all'?'active':''}" data-filter="all">Tất cả</button></div><div class="card"><div class="card-head"><div class="card-title">Danh sách của bạn <span class="card-meta">· ${tasks.length} công việc</span></div><span class="card-meta">Mỗi dấu ✓ là một lời hứa được giữ.</span></div><div class="task-list">${tasks.map(t=>taskCard(t)).join('')||'<div class="empty"><div class="empty-ico">🪴</div>Không có công việc ở đây. Một khoảng trống cũng là cơ hội để nghỉ ngơi.</div>'}</div></div></div>`}

${state.habits.map(h=>`<div class="card"><div class="goal-card-head"><div class="habit-left"><div class="habit-icon" style="background:${h.color||'#f0edff'}">${esc(h.icon)}</div><div><div class="habit-name">${esc(h.name)}</div><div class="habit-sub">${Object.values(h.history||{}).filter(Boolean).length} lần đã ghi nhận</div></div></div><button class="mini-action" data-action="delete-habit" data-id="${h.id}" title="Xóa">×</button></div><div class="divider"></div><div class="goal-bottom"><span>Hôm nay</span><b style="color:${habitDone(h)?'var(--green)':'var(--muted)'}">${habitDone(h)?'Đã hoàn thành':'Chưa thực hiện'}</b></div><button class="soft-btn" style="width:100%;margin-top:12px" data-action="toggle-habit" data-id="${h.id}">${habitDone(h)?'Bỏ đánh dấu':'✓ Hoàn thành hôm nay'}</button></div>`).join('')}</div></div>`}

function isIosDevice(){return /iPhone|iPad|iPod/i.test(navigator.userAgent)||((navigator.platform==='MacIntel')&&navigator.maxTouchPoints>1)}
function isInstalledPwa(){return !!(window.matchMedia?.('(display-mode: standalone)').matches||window.navigator.standalone)}
function notificationPermission(){return ('Notification' in window)?Notification.permission:'unsupported'}
function reminderTasks(){return (state.tasks||[]).filter(t=>t.reminderAt&&!t.completed).sort((a,b)=>new Date(a.reminderAt)-new Date(b.reminderAt));}
function localDateTimeLabel(value){if(!value)return '';const d=new Date(value);if(Number.isNaN(d.getTime()))return value;return d.toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}
async function enableTaskNotifications(){
 if(!('Notification' in window)){toast('Trình duyệt này chưa hỗ trợ thông báo.');return;}

  else if(permission==='denied')toast('Thông báo đang bị từ chối. Bạn có thể bật lại trong Cài đặt thông báo của thiết bị.');

async function showSystemNotification(title,body,tag='daymark-reminder',data={}){
 if(notificationPermission()!=='granted')return false;
 const options={body,icon:'./icon-192.png',badge:'./icon-192.png',tag,renotify:true,requireInteraction:true,data:{url:'./',...data}};
 try{
  if('serviceWorker' in navigator){const reg=await navigator.serviceWorker.ready;if(reg?.showNotification){await reg.showNotification(title,options);return true;}}
  const n=new Notification(title,options);n.onclick=()=>{window.focus();n.close()};return true;
 }catch(e){console.warn('Notification unavailable',e);return false;}
}
function checkTaskReminders(){
 const now=Date.now();let changed=false;
 for(const task of (state.tasks||[])){
  if(task.completed||!task.reminderAt||task.reminderSentAt)continue;
  const at=new Date(task.reminderAt).getTime();if(!Number.isFinite(at)||at>now)continue;
  // Do not consume a reminder while the app is hidden and Notifications are unavailable.
  // It will be checked again when the user returns to DAYMARK.
  if(document.hidden&&notificationPermission()!=='granted')continue;
  task.reminderSentAt=new Date().toISOString();changed=true;
  const late=now-at>60000;
  const title=late?'Bạn có một việc cần xem lại':'Đến giờ thực hiện nhiệm vụ';
  const body=`${task.title}${late?' · Thời điểm nhắc: '+localDateTimeLabel(task.reminderAt):''}`;
  if(notificationPermission()==='granted'){
   showSystemNotification(title,body,`task-${task.id}`,{taskId:task.id}).then(ok=>{if(!ok&&!document.hidden)toast(`⏰ ${title}: ${task.title}`)});
  }else if(!document.hidden){
   toast(`⏰ ${title}: ${task.title}`);
  }
 }
 if(changed)save();
}
function startReminderChecks(){checkTaskReminders();if(window.__daymarkReminderInterval)clearInterval(window.__daymarkReminderInterval);window.__daymarkReminderInterval=setInterval(checkTaskReminders,15000);}
function icsEscape(text){return String(text||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');}
function icsUtc(value){const d=new Date(value);return d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z');}
function createIcs(tasks){
 const now=icsUtc(new Date());const events=tasks.filter(t=>t.reminderAt&&!t.completed).map(t=>{const start=new Date(t.reminderAt);if(Number.isNaN(start.getTime()))return '';const end=new Date(start.getTime()+15*60000);return ['BEGIN:VEVENT',`UID:daymark-${icsEscape(t.id)}@daymark.app`,`DTSTAMP:${now}`,`DTSTART:${icsUtc(start)}`,`DTEND:${icsUtc(end)}`,`SUMMARY:${icsEscape('DAYMARK: '+t.title)}`,`DESCRIPTION:${icsEscape((t.notes||'Nhắc việc từ DAYMARK')+'\\nNhóm: '+(t.area||'Khác'))}`,'BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY',`DESCRIPTION:${icsEscape(t.title)}`,'END:VALARM','END:VEVENT'].join('\r\n')}).filter(Boolean);
 return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//DAYMARK//Task Reminders//VI','CALSCALE:GREGORIAN','METHOD:PUBLISH',...events,'END:VCALENDAR'].join('\r\n');
}
async function exportRemindersToCalendar(tasks){
 const list=(tasks||[]).filter(t=>t.reminderAt&&!t.completed);if(!list.length){toast('Chưa có nhiệm vụ nào được đặt giờ nhắc.');return;}
 const content=createIcs(list);const filename=`daymark-reminders-${today()}.ics`;const file=new File([content],filename,{type:'text/calendar;charset=utf-8'});
 try{if(navigator.canShare?.({files:[file]})&&navigator.share){await navigator.share({files:[file],title:'DAYMARK — Lịch nhắc việc'});toast('Đã mở bảng chia sẻ lịch nhắc. Chọn Lịch/Calendar để thêm sự kiện.');return;}}
 catch(e){if(e.name==='AbortError')return;}
 const blob=new Blob([content],{type:'text/calendar;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('Đã tạo file lịch .ics. Mở file trên iPhone rồi thêm vào Lịch.');
}

function localCoachReply(question){

  if(/học|thi|aptis|tiếng anh|english|code|c\+\+|dsa|điện tử/.test(q))return 'Hãy học theo vòng lặp chủ động:\\n1. Chọn một chủ điểm nhỏ và xác định đầu ra cụ thể.\\n2. Học 15 phút, đóng tài liệu và tự nhắc lại.\\n3. Làm một bài tập hoặc tự tạo ví dụ trong 20 phút.\\n4. Ghi lại đúng một lỗi cần sửa.\\n5. Ôn lại vào ngày mai.\\nMột buổi học có sản phẩm nhỏ tốt hơn một buổi chỉ đọc thật lâu.';
  return 'Mình đề xuất bắt đầu bằng một câu hỏi nhỏ: điều gì sẽ khiến hôm nay được xem là một ngày có tiến bộ?\\nChọn một hành động có thể hoàn thành trong 25 phút, gắn nó với mục tiêu quan trọng nhất và ghi lại kết quả sau khi làm. Nếu vấn đề phức tạp hơn, bạn có thể chia sẻ phần tóm tắt DAYMARK với ChatGPT để phân tích sâu hơn.';
}

function addBrainNote(note=null){
 const n=note||{};
 openModal(note?'Chỉnh sửa ghi chú':'Ghi chú mới',`<div class="field"><label>Tiêu đề *</label><input name="title" required maxlength="100" value="${esc(n.title||'')}" placeholder="Một ý tưởng, kiến thức hoặc điều cần nhớ"></div><div class="form-row"><div class="field"><label>Thư mục</label><select name="folder">${['Học tập','Ý tưởng','Công việc','Cuộc sống','Đọc sách','Khác'].map(x=>`<option ${x===(n.folder||'Học tập')?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Tags (ngăn cách bằng dấu phẩy)</label><input name="tags" maxlength="180" value="${esc((n.tags||[]).join(', '))}" placeholder="Aptis, C++, ý tưởng"></div></div><div class="field"><label>Nội dung *</label><textarea name="content" required rows="8" maxlength="12000" placeholder="Ghi lại bằng lời của bạn. Bạn có thể thêm ví dụ, câu hỏi và liên kết...">${esc(n.content||'')}</textarea></div><label class="milestone"><input type="checkbox" name="favorite" ${n.favorite?'checked':''}> <span>Ghim ghi chú này lên đầu</span></label>`,note?'Lưu ghi chú':'Lưu vào Second Brain',fd=>{
   const now=today(),item={id:note?.id||uid(),title:fd.get('title').trim(),folder:fd.get('folder'),tags:fd.get('tags').split(',').map(x=>x.trim()).filter(Boolean).slice(0,10),content:fd.get('content').trim(),favorite:fd.get('favorite')==='on',created:note?.created||now,updated:now};
   if(note)state.brainNotes=state.brainNotes.map(x=>x.id===note.id?item:x);else state.brainNotes.unshift(item);
   if(!note)award(`brain-note-${item.id}`,5,'Một ý tưởng đã được lưu giữ!');save();closeModal();render();toast('Đã lưu vào Second Brain.');
 },true);
}
function renderBrain(){
 const folders=['Tất cả',...new Set(state.brainNotes.map(n=>n.folder||'Khác'))];
 let notes=state.brainNotes.filter(n=>brainFolder==='Tất cả'||(n.folder||'Khác')===brainFolder);
 if(brainQuery)notes=notes.filter(n=>`${n.title} ${n.content} ${(n.tags||[]).join(' ')} ${n.folder}`.toLowerCase().includes(brainQuery.toLowerCase()));

av" data-id="${n.id}">${n.favorite?'★':'☆'}</button><button data-action="copy-note" data-id="${n.id}">⧉</button><button data-action="delete-note" data-id="${n.id}">×</button></span></div></article>`).join('')||'<div class="empty" style="grid-column:1/-1"><div class="empty-ico">🧠</div>Chưa tìm thấy ghi chú. Lưu lại một điều bạn vừa học được nhé.</div>'}</div><p class="card-meta" style="line-height:1.6;margin-top:15px">Mẹo: một ghi chú tốt thường có tiêu đề cụ thể, giải thích bằng lời của bạn, một ví dụ và tags để tìm lại.</p></div>`;

function renderSmartAnalytics(){
 const days=Array.from({length:7},(_,i)=>dateAdd(today(),i-6));
 const focus=days.map(d=>minutesFocused(d));const maxFocus=Math.max(30,...focus);
 const taskDone=completedTasksSince(7);const habits7=state.habits.reduce((sum,h)=>sum+days.filter(d=>habitDone(h,d)).length,0);
 const possible=state.habits.length*7;const habitRate=possible?Math.round(habits7/possible*100):0;
 const totalFocus=state.sessions.reduce((a,s)=>a+(Number(s.minutes)||0),0);
 const completed=state.tasks.filter(t=>t.completed).length;const total=state.tasks.length;
 const areas=[...new Set(state.tasks.map(t=>t.area||'Khác'))].map(area=>({area,count:state.tasks.filter(t=>(t.area||'Khác')===area&&t.completed).length})).sort((a,b)=>b.count-a.count).slice(0,5);
 const goalAvg=state.goals.length?Math.round(state.goals.reduce((a,g)=>a+(Number(g.progress)||0),0)/state.goals.length):0;
 const best=focus.indexOf(Math.max(...focus));
 return `<div class="page">${pageHead('MEASURE WHAT MATTERS','Phân tích thông minh','Nhìn xu hướng để điều chỉnh hệ thống — không dùng số liệu để tự phán xét.')}<div class="stats-grid"><div class="analytics-kpi"><small>XP tích lũy</small><strong>${state.xp||0}</strong><small>Level ${level()} · ${esc(levelName())}</small></div><div class="analytics-kpi"><small>Việc hoàn thành</small><strong>${completed}</strong><small>${total?Math.round(completed/total*100):0}% trên toàn bộ danh sách</small></div><div class="analytics-kpi"><small>Thời gian tập trung</small><strong>${Math.round(totalFocus/60*10)/10}h</strong><small>${state.sessions.length} phiên đã ghi nhận</small></div><div class="analytics-kpi"><small>Thói quen 7 ngày</small><strong>${habitRate}%</strong><small>${habits7} check-in trong ${possible} cơ hội</small></div></div><div class="analytics-grid" style="margin-top:16px"><section class="card"><div class="card-head"><div><div class="card-title">◷ Tập trung theo ngày</div><div class="card-meta">7 ngày gần nhất · phút</div></div><span class="tag">Đỉnh: ${focus[best]||0}m</span></div><div class="analytics-bars">${days.map((d,i)=>`<div class="analytics-bar ${d===today()?'active':''}"><b>${focus[i]}</b><i style="height:${Math.max(3,focus[i]/maxFocus*100)}%"></i><small>${dayNames[dateObj(d).getDay()]}</small></div>`).join('')}</div></section><section class="card"><div class="card-head"><div><div class="card-title">☑ Nhịp hoàn thành</div><div class="card-meta">Trong 7 ngày qua</div></div></div><div class="insight-number">${taskDone}</div><div class="insight-copy">Công việc có ngày hoàn thành được ghi lại trong tuần. Các việc đã xong từ phiên bản cũ có thể chưa có mốc ngày.</div><div class="bar" style="margin-top:16px"><span style="width:${Math.min(100,taskDone*10)}%"></span></div></section><section class="card"><div class="card-head"><div><div class="card-title">📚 Hoạt động theo lĩnh vực</div><div class="card-meta">Số công việc hoàn thành</div></div></div>${areas.map(a=>`<div style="margin:13px 0"><div class="goal-top"><span class="goal-name">${esc(a.area)}</span><b class="card-meta">${a.count}</b></div><div class="bar"><span style="width:${Math.min(100,total? a.count/Math.max(1,completed)*100:0)}%"></span></div></div>`).join('')||'<div class="empty">Chưa có dữ liệu lĩnh vực.</div>'}</section><section class="card"><div class="card-head"><div><div class="card-title">◎ Mục tiêu dài hạn</div><div class="card-meta">Tiến độ trung bình</div></div></div><div class="insight-number">${goalAvg}%</div><div class="insight-copy">${state.goals.length} mục tiêu đang được theo dõi.</div>${state.goals.slice(0,4).map(g=>`<div style="margin-top:13px"><div class="goal-top"><span class="goal-name">${esc(g.title)}</span><b class="card-meta">${g.progress}%</b></div><div class="bar"><span style="width:${g.progress}%"></span></div></div>`).join('')}</section></div><section class="card" style="margin-top:16px"><div class="card-title">🪄 Gợi ý điều chỉnh tuần này</div><div class="coach-advice"><div class="coach-advice-icon">🎯</div><div><b style="font-size:12px">Chọn ít ưu tiên hơn, hoàn thành sâu hơn</b><p>Nếu có nhiều việc dang dở, hãy giới hạn 1–3 ưu tiên mỗi ngày và chừa thời gian dự phòng.</p></div></div><div class="coach-advice"><div class="coach-advice-icon">🌿</div><div><b style="font-size:12px">Đo sự đều đặn, không đòi hoàn hảo</b><p>Một thói quen làm phiên bản 2 phút vẫn tốt hơn bỏ hẳn vì không đủ thời gian.</p></div></div><div class="coach-advice"><div class="coach-advice-icon">🧭</div><div><b style="font-size:12px">Review cuối tuần</b><p>Ghi lại điều hiệu quả, điểm nghẽn và một thay đổi nhỏ cho tuần tới.</p></div></div></section></div>`;

// ====================== DAYMARK 3.0: CLOUD SYNC + AI ======================
const DAYMARK_V3 = '3.0.0';
const cloud = { client:null, user:null, channel:null, ready:false, syncing:false, dirty:false, localRevision:0, remoteVersion:null, pendingRemote:null, timer:null, lastSync:null, status:'Chưa kết nối', suppress:false, handlingUser:null };
const aiScope = { profile:false, tasks:false, goals:false, habits:false, focus:false, notes:false, journal:false };
let aiDraft='', aiMode='coach', aiBusy=false, aiMessages=[];

 const c=window.DAYMARK_CONFIG||{};
 return !!(c.SUPABASE_URL && c.SUPABASE_ANON_KEY && /^https:\/\//.test(c.SUPABASE_URL));

 const b=$('#cloudAccountBtn'); if(!b)return;
 if(cloud.user){b.textContent=cloud.syncing?'☁ Đang đồng bộ…':cloud.dirty?'☁ Chờ đồng bộ':cloud.pendingRemote?'⚠ Xung đột':'☁ '+(cloud.status==='Đã đồng bộ'?'Đã đồng bộ':'Đã đăng nhập');b.title=cloud.user.email||'Tài khoản DAYMARK';}
 else b.textContent=cloudConfigured()?'☁ Đăng nhập':'☁ Thiết lập cloud';

function cloudStatusHtml(){
 const cls=cloud.pendingRemote?'warn':(cloud.user&&cloud.ready&&!cloud.dirty?'ok':'');
 const label=cloud.pendingRemote?'Cần xử lý xung đột':cloud.syncing?'Đang đồng bộ…':cloud.dirty?'Có thay đổi chờ đồng bộ':cloud.user?(cloud.ready?'Đã đồng bộ':'Đang kết nối'):cloudConfigured()?'Chưa đăng nhập':'Chưa cấu hình';
 const dot=cls==='ok'?'ok':cls==='warn'?'warn':'';
 return `<span class="cloud-status"><i class="cloud-dot ${dot}"></i>${esc(label)}</span>`;
}
function normalizeCloudState(data){
 const base=defaults();const x=(data&&typeof data==='object')?data:{};
 const merged={...base,...x};
 for(const k of ['tasks','habits','goals','journal','sessions','brainNotes','coachNotes','rewardKeys']) if(!Array.isArray(x[k])) merged[k]=base[k];
 merged.rpg={...base.rpg,...(x.rpg||{})};
 if(!Array.isArray(merged.rpg.redeemed))merged.rpg.redeemed=[];
 if(!merged.rpg.claimed||typeof merged.rpg.claimed!=='object')merged.rpg.claimed={};
 return merged;
}
function recoveryBackup(){
 try{
  const payload={savedAt:new Date().toISOString(),source:'DAYMARK 2.1 local data before DAYMARK 3.0 cloud migration',state:JSON.parse(JSON.stringify(state))};
  // Keep one recovery snapshot to reduce localStorage quota pressure.
  localStorage.setItem('daymark-v3-last-recovery',JSON.stringify(payload));
  return true;
 }catch(e){
  console.error('Could not store recovery snapshot',e);
  toast('Không tạo được bản sao lưu phục hồi. DAYMARK giữ nguyên dữ liệu hiện tại và chưa thay bằng dữ liệu Cloud. Hãy xuất JSON rồi thử lại.');
  return false;
 }
}
function applyCloudState(data,updatedAt){
 if(!recoveryBackup())return false;
 cloud.suppress=true;
 try{
  const nextState=normalizeCloudState(data);
  const serialized=JSON.stringify(nextState);
  // Write new state only after the recovery snapshot succeeded.
  localStorage.setItem(STORAGE_KEY,serialized);
  state=nextState;
  currentPage=state.page||'dashboard';
  cloud.remoteVersion=updatedAt||null;cloud.lastSync=new Date().toISOString();cloud.dirty=false;cloud.pendingRemote=null;cloud.ready=true;cloud.status='Đã đồng bộ';
  document.body.classList.toggle('dark',state.theme==='dark');
  render();
  return true;
 }catch(e){
  console.error('Could not apply cloud state',e);
  toast('Không thể khôi phục dữ liệu Cloud vào bộ nhớ thiết bị. Dữ liệu cũ vẫn được giữ; hãy xuất backup và kiểm tra dung lượng.');
  return false;
 }finally{cloud.suppress=false;}
}

function hasLocalWork(){
 return !!((state.tasks||[]).length||(state.habits||[]).length||(state.goals||[]).length||(state.journal||[]).length||(state.brainNotes||[]).length||(state.sessions||[]).length||(state.xp||0));
}
function showCloudConflict(remoteRow,reason='Một thiết bị khác vừa cập nhật dữ liệu.'){
 if(!remoteRow||!remoteRow.state_data)return;
 cloud.pendingRemote=remoteRow;cloud.dirty=true;cloud.status='Cần xử lý xung đột';updateCloudBadge();
 const useRemote=window.confirm(`${reason}\n\nOK: dùng dữ liệu Cloud và thay dữ liệu đang mở trên thiết bị này.\nHủy: giữ dữ liệu trên thiết bị này và ghi đè lên Cloud sau khi xác nhận.`);
 if(useRemote){if(applyCloudState(remoteRow.state_data,remoteRow.updated_at))toast('Đã tải phiên bản Cloud mới nhất.');}
 else{cloud.remoteVersion=remoteRow.updated_at;cloud.pendingRemote=null;cloud.dirty=true;toast('Đã giữ dữ liệu trên thiết bị. Đang chuẩn bị đồng bộ lên Cloud…');scheduleCloudSync(250);}
}
async function syncNow(){
 if(!cloud.client||!cloud.user||!cloud.ready)return;
 if(!navigator.onLine){cloud.dirty=true;cloud.status='Đang offline';updateCloudBadge();return;}
 if(cloud.syncing)return;
 cloud.syncing=true;updateCloudBadge();
 const revisionAtStart=cloud.localRevision;
 let requestSucceeded=false;
 let snapshot;
 try{snapshot=JSON.parse(JSON.stringify(state));}
 catch(e){cloud.syncing=false;cloud.dirty=true;cloud.status='Không thể đóng gói dữ liệu';updateCloudBadge();toast('Không thể chuẩn bị dữ liệu để đồng bộ.');return;}
 try{
  const expected=cloud.remoteVersion;
  const {data,error}=await cloud.client.rpc('save_daymark_state',{p_state:snapshot,p_expected_updated_at:expected});
  if(error)throw error;
  const row=Array.isArray(data)?data[0]:data;
  if(!row)throw new Error('Không nhận được kết quả đồng bộ từ máy chủ.');
  if(row.conflict){cloud.syncing=false;cloud.pendingRemote=null;showCloudConflict({state_data:row.state_data,updated_at:row.updated_at},'Dữ liệu Cloud đã thay đổi trước khi bản này kịp đồng bộ.');return;}
  requestSucceeded=true;
  cloud.remoteVersion=row.updated_at;cloud.lastSync=new Date().toISOString();
  if(cloud.localRevision===revisionAtStart){cloud.dirty=false;cloud.status='Đã đồng bộ';}
  else{cloud.dirty=true;cloud.status='Có chỉnh sửa mới, đang chờ đồng bộ';}
 }catch(e){console.error('DAYMARK cloud sync error:',e);cloud.dirty=true;cloud.status='Lỗi đồng bộ';toast('Không đồng bộ được. Dữ liệu vẫn còn trên thiết bị; hãy thử lại khi mạng ổn định.');}
 finally{
  cloud.syncing=false;
  const deferred=cloud.pendingRemote;
  if(deferred&&deferred.updated_at!==cloud.remoteVersion){cloud.pendingRemote=null;setTimeout(()=>showCloudConflict(deferred,'Có cập nhật Cloud phát sinh trong lúc đồng bộ.'),0);}
  else if(deferred&&deferred.updated_at===cloud.remoteVersion)cloud.pendingRemote=null;
  updateCloudBadge();if(currentPage==='settings')render();
  // If the local state changed while the request was in flight, send the newer snapshot too.
  if(requestSucceeded&&cloud.dirty&&cloud.ready&&cloud.user&&!cloud.pendingRemote&&navigator.onLine)scheduleCloudSync(350);
 }
}

function scheduleCloudSync(delay=1300){
 if(cloud.suppress||!cloud.user||!cloud.ready)return;
 cloud.dirty=true;cloud.status=navigator.onLine?'Chờ đồng bộ':'Đang offline';updateCloudBadge();
 clearTimeout(cloud.timer);cloud.timer=setTimeout(()=>syncNow(),delay);
}
async function subscribeCloud(){
 if(!cloud.client||!cloud.user)return;
 if(cloud.channel){await cloud.client.removeChannel(cloud.channel).catch(()=>{});cloud.channel=null;}
 cloud.channel=cloud.client.channel('daymark-sync-'+cloud.user.id)
  .on('postgres_changes',{event:'*',schema:'public',table:'daymark_states',filter:'user_id=eq.'+cloud.user.id},payload=>{
   const row=payload.new;if(!row||!row.state_data)return;
   if(row.updated_at===cloud.remoteVersion)return;
   if(cloud.syncing){cloud.pendingRemote=row;return;}
   if(cloud.pendingRemote&&cloud.pendingRemote.updated_at===row.updated_at)return;
   if(cloud.dirty||cloud.pendingRemote){showCloudConflict(row,'Một thay đổi khác vừa xuất hiện trên Cloud.');return;}
   if(applyCloudState(row.state_data,row.updated_at))toast('Đã nhận cập nhật từ thiết bị khác.');
   else{cloud.pendingRemote=row;cloud.status='Cần xử lý bản sao lưu trước khi tải Cloud';updateCloudBadge();}
  })
  .subscribe(status=>{if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){cloud.status='Realtime chưa sẵn sàng';updateCloudBadge();}});
}
async function resolveFirstCloudSync(user){
 cloud.status='Đang tải dữ liệu Cloud';updateCloudBadge();
 const {data:row,error}=await cloud.client.from('daymark_states').select('state_data,updated_at').eq('user_id',user.id).maybeSingle();
 if(error)throw error;
 if(!row){
  if(!recoveryBackup())throw new Error('Không tạo được bản sao lưu trước khi đồng bộ. Hãy xuất JSON rồi thử lại.');
  cloud.remoteVersion=null;cloud.ready=true;cloud.dirty=true;cloud.status='Đang đưa dữ liệu thiết bị lên Cloud';
  await syncNow();return;
 }
 const hasLocal=hasLocalWork();
 if(hasLocal){
  const useCloud=window.confirm('DAYMARK tìm thấy dữ liệu đã có trên Cloud.\n\nOK: tải dữ liệu Cloud xuống thiết bị này.\nHủy: giữ dữ liệu hiện tại của thiết bị và đồng bộ nó lên Cloud.\n\nTrước khi thay dữ liệu, DAYMARK sẽ tạo bản sao lưu cục bộ.');
  if(useCloud){if(!applyCloudState(row.state_data,row.updated_at))throw new Error('Không thể tạo bản sao lưu/khôi phục Cloud. Dữ liệu cũ vẫn được giữ.');}
  else{if(!recoveryBackup())throw new Error('Không thể tạo bản sao lưu. Hãy xuất JSON rồi thử lại.');cloud.remoteVersion=row.updated_at;cloud.ready=true;cloud.dirty=true;await syncNow();}
 }else{if(!applyCloudState(row.state_data,row.updated_at))throw new Error('Không thể tạo bản sao lưu/khôi phục Cloud. Dữ liệu cũ vẫn được giữ.');}
}
async function handleCloudUser(user){
 if(!user){
  if(cloud.channel&&cloud.client){await cloud.client.removeChannel(cloud.channel).catch(()=>{});cloud.channel=null;}
  cloud.user=null;cloud.ready=false;cloud.remoteVersion=null;cloud.pendingRemote=null;cloud.status='Đã đăng xuất';cloud.handlingUser=null;updateCloudBadge();return;
 }
 if(cloud.handlingUser===user.id&&(cloud.ready||cloud.status==='Đang kết nối'||cloud.status==='Đang tải dữ liệu Cloud'))return;
 cloud.handlingUser=user.id;cloud.user=user;cloud.ready=false;cloud.status='Đang kết nối';updateCloudBadge();
 try{await resolveFirstCloudSync(user);await subscribeCloud();}
 catch(e){console.error('DAYMARK auth/sync error:',e);cloud.ready=false;cloud.status='Lỗi cấu hình hoặc quyền truy cập';toast('Kết nối Cloud chưa hoàn tất. Kiểm tra SQL, URL và khóa publishable/anon.');}
 updateCloudBadge();if(currentPage==='settings')render();
}
async function initDaymarkCloud(){
 if(!cloudConfigured()){cloud.status='Chưa cấu hình';updateCloudBadge();return;}
 if(!window.supabase?.createClient){cloud.status='Không tải được Supabase SDK';updateCloudBadge();return;}

 cloud.client=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 cloud.client.auth.onAuthStateChange((_event,session)=>{setTimeout(()=>handleCloudUser(session?.user||null),0);});
 const {data,error}=await cloud.client.auth.getSession();
 if(error){cloud.status='Lỗi xác thực';updateCloudBadge();return;}
 await handleCloudUser(data.session?.user||null);
}

  $('#modalSyncNow')?.addEventListener('click',()=>syncNow());return;
 }
 openModal('Đăng nhập DAYMARK Cloud',`<p class="card-meta" style="line-height:1.6">Dùng cùng một tài khoản trên máy tính và iPhone để đồng bộ. Khi đăng nhập, toàn bộ dữ liệu DAYMARK của tài khoản này — gồm công việc, mục tiêu, thói quen, ghi chú, nhật ký, phiên tập trung và tiến trình RPG — sẽ được lưu trong dự án Supabase của bạn. Mật khẩu được gửi trực tiếp tới Supabase Auth qua HTTPS, không lưu trong DAYMARK.</p><div class="field"><label>Email</label><input name="email" type="email" required maxlength="180" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Mật khẩu</label><input name="password" type="password" required minlength="8" maxlength="128" autocomplete="current-password" placeholder="Tối thiểu 8 ký tự"></div><div class="field"><label>Hành động</label><select name="authMode"><option value="signin">Đăng nhập tài khoản có sẵn</option><option value="signup">Tạo tài khoản mới</option></select></div><label class="ai-consent"><input type="checkbox" name="cloudDataConsent" required><span><b>Tôi đồng ý lưu bản dữ liệu DAYMARK đầy đủ lên Supabase</b> để đồng bộ giữa các thiết bị. Tôi đã xuất bản sao lưu riêng và hiểu rằng đăng xuất chỉ dừng đồng bộ, không tự xóa bản Cloud.</span></label><p class="card-meta">Nếu bật xác nhận email trong Supabase, bạn cần xác nhận email trước khi đăng nhập lần đầu.</p>`,'Tiếp tục',async fd=>{
  if(fd.get('cloudDataConsent')!=='on'){toast('Bạn cần xác nhận việc lưu dữ liệu trên Cloud.');return;}
  const email=String(fd.get('email')||'').trim(),password=String(fd.get('password')||''),mode=String(fd.get('authMode'));
  if(!email||password.length<8){toast('Hãy nhập email và mật khẩu hợp lệ.');return;}
  const submit=$('#modalForm button[type="submit"]');if(submit){submit.disabled=true;submit.textContent='Đang kết nối…';}
  try{
   let result;
   if(mode==='signup')result=await cloud.client.auth.signUp({email,password,options:{emailRedirectTo:location.href}});
   else result=await cloud.client.auth.signInWithPassword({email,password});
   if(result.error)throw result.error;
   closeModal();
   if(mode==='signup'&&!result.data.session){toast('Tài khoản đã tạo. Hãy mở email xác nhận, sau đó đăng nhập.');return;}
   if(result.data.user)await handleCloudUser(result.data.user);
   toast(mode==='signup'?'Tạo tài khoản thành công.':'Đăng nhập thành công.');
  }catch(e){console.error(e);if(submit){submit.disabled=false;submit.textContent='Tiếp tục';}toast('Không thể đăng nhập: '+(e.message||'hãy kiểm tra thông tin và cấu hình Supabase.'));}
 },true);
}

function renderCloudSettingsCard(){
 const logged=cloud.user;
 const actions=logged?`<div class="cloud-actions"><button class="primary-btn" data-dm="sync-now">↻ Đồng bộ ngay</button><button class="soft-btn" data-dm="signout">Đăng xuất</button></div>`:`<div class="cloud-actions"><button class="primary-btn" data-dm="account">${cloudConfigured()?'Đăng nhập / tạo tài khoản':'Thiết lập kết nối'}</button></div>`;
 return `<section class="cloud-panel"><div class="card-head"><div><div class="card-title">☁ DAYMARK Cloud Sync</div><div class="card-meta" style="margin-top:4px">Tài khoản và đồng bộ tự động giữa máy tính, iPhone và thiết bị khác.</div></div>${cloudStatusHtml()}</div><p class="card-meta" style="line-height:1.65;margin:10px 0">${logged?'Đang dùng tài khoản '+esc(cloud.user.email||'đã đăng nhập')+'. Thay đổi được lưu cục bộ trước, sau đó đồng bộ lên Cloud.':'Bạn cần cấu hình Supabase và đăng nhập cùng một tài khoản trên các thiết bị.'}</p>${actions}<div class="divider"></div><div class="card-meta" style="line-height:1.6">${cloud.pendingRemote?'Có cập nhật xung đột cần bạn chọn phiên bản.':cloud.dirty?'Một số thay đổi đang chờ mạng hoặc đồng bộ.':cloud.lastSync?'Đồng bộ gần nhất: '+esc(new Date(cloud.lastSync).toLocaleString('vi-VN')):'Chưa có lần đồng bộ nào.'}</div><p class="card-meta" style="margin-top:8px">Bản sao lưu phục hồi trước khi chuyển dữ liệu được giữ trên thiết bị này trong localStorage với khóa <code>daymark-v3-last-recovery</code>.</p></section>`;
}
function renderAiSettingsCard(){return `<section class="cloud-panel"><div class="card-head"><div><div class="card-title">✦ Trợ lý cục bộ miễn phí</div><div class="card-meta" style="margin-top:4px">Không cần OpenAI API hoặc thẻ thanh toán</div></div><span class="tag">NO API</span></div><p class="card-meta" style="line-height:1.65;margin:10px 0">Tính năng AI trả phí đang tạm dừng theo lựa chọn của bạn. Trợ lý cục bộ vẫn phân tích các dữ liệu đơn giản ngay trên thiết bị. Không có yêu cầu gửi dữ liệu sang mô hình AI bên ngoài.</p></section>`;}
function renderNotificationSettingsCard(){return `<section class="cloud-panel"><div class="card-head"><div><div class="card-title">🔔 Thông báo & nhắc việc</div><div class="card-meta" style="margin-top:4px">Quản lý quyền thông báo và lịch nhắc</div></div><span class="tag">${notificationPermission()==='granted'?'ĐÃ BẬT':'CHƯA BẬT'}</span></div><p class="card-meta" style="line-height:1.65;margin:10px 0">Bật thông báo bằng thao tác chủ động. Nhắc việc khi ứng dụng đóng nên được thêm vào Apple Calendar/Google Calendar để hệ điều hành phát báo đúng giờ.</p><div class="cloud-actions"><button class="primary-btn" id="enableNotifications">${notificationPermission()==='granted'?'✓ Đã bật thông báo':'Bật thông báo'}</button><button class="soft-btn" data-goto="reminders">Mở trung tâm nhắc việc</button></div></section>`;}

const daymarkRenderSettingsV2=renderSettings;
renderSettings=function(){
 let html=daymarkRenderSettingsV2();
 html=html.replace('<div class="coach-grid">','<div class="coach-grid">'+renderCloudSettingsCard()+renderNotificationSettingsCard()+renderAiSettingsCard());
 html=html.replace('Nội dung nằm trong bộ nhớ trình duyệt hiện tại, không tự gửi lên máy chủ.','Dữ liệu được lưu cục bộ và đồng bộ lên Supabase riêng của tài khoản khi bạn đăng nhập.');
 html=html.replace('Mỗi thiết bị có bộ nhớ riêng. Dùng Xuất dữ liệu trên máy cũ và Nhập dữ liệu trên máy mới để chuyển dữ liệu.','Dùng cùng tài khoản Supabase trên các thiết bị. DAYMARK phát hiện xung đột thay vì âm thầm ghi đè.');
 html=html.replace('Gợi ý mặc định chạy bằng quy tắc cục bộ. Chỉ khi bạn bấm Chia sẻ thì nội dung tóm tắt mới được đưa sang ứng dụng khác.','Trợ lý cục bộ chạy trên thiết bị; tích hợp AI API đang tạm dừng để không phát sinh phí.');
 return html;
};

function aiContextFromSelection(){
 const c={};
 if(aiScope.profile)c.profile={level:level(),xp:Number(state.xp)||0};
 if(aiScope.tasks)c.tasks=(state.tasks||[]).slice(0,50).map(t=>({title:String(t.title||'').slice(0,140),area:String(t.area||'').slice(0,40),due:t.due||null,priority:t.priority||'medium',completed:!!t.completed,estimate:Number(t.estimate)||25}));
 if(aiScope.goals)c.goals=(state.goals||[]).slice(0,30).map(g=>({title:String(g.title||'').slice(0,140),progress:Number(g.progress)||0,deadline:g.deadline||null,why:String(g.why||'').slice(0,350),milestones:(g.milestones||[]).slice(0,12).map(m=>({text:String(m.text||'').slice(0,120),done:!!m.done}))}));
 if(aiScope.habits)c.habits=(state.habits||[]).slice(0,30).map(h=>({name:String(h.name||'').slice(0,80),last14Days:Object.fromEntries(Object.entries(h.history||{}).filter(([d])=>d>=dateAdd(today(),-13)&&d<=today()).slice(0,14))}));
 if(aiScope.focus)c.focus=(state.sessions||[]).filter(x=>x.date>=dateAdd(today(),-29)).slice(-80).map(x=>({date:x.date,minutes:Number(x.minutes)||0,label:String(x.label||'').slice(0,60)}));
 if(aiScope.notes)c.notes=(state.brainNotes||[]).slice(-20).map(n=>({title:String(n.title||'').slice(0,120),content:String(n.content||'').slice(0,1200),tags:(n.tags||[]).slice(0,8),folder:String(n.folder||'').slice(0,60)}));
 if(aiScope.journal)c.journal=(state.journal||[]).slice(-10).map(j=>({date:j.date,title:String(j.title||'').slice(0,100),text:String(j.text||'').slice(0,700),mood:String(j.mood||'').slice(0,50)}));
 return c;
}
function renderAiMessages(){return aiMessages.map(m=>`<div class="ai-message ${m.role==='user'?'user':'assistant'}"><span class="ai-role">${m.role==='user'?'BẠN':'DAYMARK AI'}</span>${esc(m.text)}</div>`).join('');}
function renderCoach(){
 const ideas=coachInsights();
 const priority=state.tasks.filter(t=>!t.completed).sort((a,b)=>({high:0,medium:1,low:2}[a.priority]??1)-({high:0,medium:1,low:2}[b.priority]??1)).slice(0,4);
 return `<div class="page">${pageHead('ON-DEVICE · FREE','Trợ lý phát triển','Gợi ý dựa trên dữ liệu đang lưu trên thiết bị. Không gọi OpenAI API, không cần API key và không phát sinh phí.')}<section class="coach-hero"><div class="coach-chip">✦ LOCAL COACH · NO API</div><h2>Không cần AI trả phí để bắt đầu giữ kỷ luật.</h2><p>DAYMARK dùng các quy tắc đơn giản để nhận diện việc tồn đọng, thời gian tập trung và thói quen. Đây không phải mô hình AI hội thoại, nhưng hoạt động miễn phí ngay trên thiết bị.</p></section><div class="stats-grid" style="margin-top:16px"><div class="stat-card"><div class="stat-ico" style="background:#eae6ff">☑</div><div><div class="stat-value">${doneToday()}</div><div class="stat-label">Việc xong hôm nay</div></div></div><div class="stat-card"><div class="stat-ico" style="background:#e3f7ef">◷</div><div><div class="stat-value">${minutesFocused()}m</div><div class="stat-label">Tập trung hôm nay</div></div></div><div class="stat-card"><div class="stat-ico" style="background:#fff0e7">✳</div><div><div class="stat-value">${allHabitDone()}</div><div class="stat-label">Thói quen hôm nay</div></div></div><div class="stat-card"><div class="stat-ico" style="background:#e9f2ff">◎</div><div><div class="stat-value">${state.goals.filter(g=>g.progress>=100).length}</div><div class="stat-label">Mục tiêu hoàn tất</div></div></div></div><div class="coach-grid" style="margin-top:16px"><section class="card"><div class="card-head"><div><div class="card-title">🧭 Điều DAYMARK nhận thấy</div><div class="card-meta">Phân tích cục bộ từ dữ liệu của bạn</div></div><span class="tag">Miễn phí</span></div>${ideas.map(x=>`<div class="coach-advice"><div class="coach-advice-icon">${x.icon}</div><div style="flex:1"><b style="font-size:12px">${esc(x.title)}</b><p>${esc(x.text)}</p><button class="text-btn" data-goto="${x.page}">${esc(x.cta)} →</button></div></div>`).join('')}</section><section class="card"><div class="card-head"><div><div class="card-title">🎯 Những việc nên xử lý trước</div><div class="card-meta">Sắp xếp theo mức ưu tiên</div></div></div>${priority.map((t,i)=>`<div class="coach-advice"><div class="coach-advice-icon">${i+1}</div><div><b style="font-size:12px">${esc(t.title)}</b><p>${esc(t.area||'Cá nhân')} · ${t.estimate||25} phút · ${esc(t.due||'Chưa đặt ngày')}</p></div></div>`).join('')||'<div class="empty">Bạn đang không có việc tồn đọng. Hãy nghỉ ngơi hoặc lên kế hoạch mới.</div>'}</section></div><section class="card" style="margin-top:16px"><div class="card-title">📝 Tự hỏi để bắt đầu</div><div class="field" style="margin-top:12px"><label>Điều gì đang khiến bạn trì hoãn?</label><textarea id="coachQuestionInput" placeholder="Viết vấn đề của bạn tại đây…">${esc(coachQuestion)}</textarea></div><button class="primary-btn" data-action="ask-coach">Nhận gợi ý cục bộ</button>${coachReply?`<div class="coach-reply">${esc(coachReply)}</div>`:''}</section></div>`;
}
async function runDaymarkAI(){toast('AI API đang tạm dừng ở DAYMARK 3.1 để tránh phát sinh chi phí. Trợ lý cục bộ vẫn dùng được.');}
const originalSaveDaymark=save;
save=function(){originalSaveDaymark();if(!cloud.suppress){cloud.localRevision++;scheduleCloudSync();}};
const originalUpdateChromeDaymark=updateChrome;
updateChrome=function(){originalUpdateChromeDaymark();updateCloudBadge();};
const originalRenderDaymark=render;
render=function(){originalRenderDaymark();updateCloudBadge();};
const originalBindGlobalDaymark=bindGlobal;
bindGlobal=function(){
 originalBindGlobalDaymark();
 $('#cloudAccountBtn')?.addEventListener('click',openCloudAccount);
 $('#view')?.addEventListener('click',e=>{
  const b=e.target.closest('[data-dm]');if(!b)return;
  const action=b.dataset.dm;
  if(action==='account')openCloudAccount();
  if(action==='sync-now')syncNow();
  if(action==='signout'){
   if(window.confirm('Đăng xuất DAYMARK Cloud? Dữ liệu cục bộ vẫn được giữ.')){(async()=>{if(cloud.dirty){await syncNow();if(cloud.dirty&&!window.confirm('Một số thay đổi chưa đồng bộ. Đăng xuất vẫn giữ dữ liệu trên thiết bị này, nhưng các thay đổi chưa lên Cloud. Bạn có chắc muốn đăng xuất?'))return;}await cloud.client?.auth.signOut();toast('Đã đăng xuất.');})();}
  }
  if(action==='ai-send')runDaymarkAI();
  if(action==='ai-clear'){aiMessages=[];aiDraft='';render();}
 });
 $('#view')?.addEventListener('change',e=>{
  const field=e.target.dataset?.aiScope;if(field&&Object.prototype.hasOwnProperty.call(aiScope,field)){aiScope[field]=e.target.checked;}
  if(e.target.id==='aiModeSelect')aiMode=e.target.value;
 });
 $('#view')?.addEventListener('input',e=>{if(e.target.id==='aiQuestion')aiDraft=e.target.value;});
};
window.addEventListener('online',()=>{if(cloud.user&&cloud.dirty){cloud.status='Đang kết nối lại';scheduleCloudSync(400);}});
window.addEventListener('offline',()=>{if(cloud.user){cloud.status='Đang offline';updateCloudBadge();}});
// =========================================================================

boot();
initDaymarkCloud();
})();
</script>
