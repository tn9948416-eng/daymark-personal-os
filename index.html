function renderTasks(){const tasks=state.tasks.filter(t=>{if(taskFilter==='today'&&t.due!==today())return false;if(taskFilter==='upcoming'&&(t.due<=today()||t.completed))return false;if(taskFilter==='done'&&!t.completed)return false;if(taskFilter==='open'&&t.completed)return false;if(taskSearch&&!(`${t.title} ${t.area}`).toLowerCase().includes(taskSearch.toLowerCase()))return false;return true}).sort((a,b)=>a.due.localeCompare(b.due));
 const groups=[['open','Đang thực hiện',tasks.filter(t=>!t.completed)],['done','Đã hoàn thành',tasks.filter(t=>t.completed)]];
 return `<div class="page">${pageHead('MAKE IT HAPPEN','Không gian công việc','Đưa suy nghĩ ra khỏi đầu và biến chúng thành những bước có thể hoàn thành.', '<button class="primary-btn" data-action="add-task">＋ Thêm công việc</button>')}<div class="toolbar" style="margin-bottom:16px"><input class="search-input" id="taskSearch" placeholder="⌕  Tìm công việc..." value="${esc(taskSearch)}"><button class="filter-btn ${taskFilter==='today'?'active':''}" data-filter="today">Hôm nay</button><button class="filter-btn ${taskFilter==='open'?'active':''}" data-filter="open">Chưa xong</button><button class="filter-btn ${taskFilter==='upcoming'?'active':''}" data-filter="upcoming">Sắp tới</button><button class="filter-btn ${taskFilter==='done'?'active':''}" data-filter="done">Đã xong</button><button class="filter-btn ${taskFilter==='all'?'active':''}" data-filter="all">Tất cả</button></div><div class="card"><div class="card-head"><div class="card-title">Danh sách của bạn <span class="card-meta">· ${tasks.length} công việc</span></div><span class="card-meta">Mỗi dấu ✓ là một lời hứa được giữ.</span></div><div class="task-list">${tasks.map(t=>taskCard(t)).join('')||'<div class="empty"><div class="empty-ico">🪴</div>Không có công việc ở đây. Một khoảng trống cũng là cơ hội để nghỉ ngơi.</div>'}</div></div></div>`}
function renderPlanner(){const base=dateAdd(today(),plannerOffset*7);const start=dateAdd(base,-((dateObj(base).getDay()+6)%7));const end=dateAdd(start,6);return `<div class="page">${pageHead('SEE THE BIG PICTURE','Lịch tuần','Nhìn lịch trình như một bản đồ — không phải một danh sách để tự gây áp lực.','<button class="primary-btn" data-action="add-task">＋ Thêm việc</button>')}<div class="card"><div class="planner-head"><div><div class="card-title">${fmt(start,{day:'numeric',month:'long'})} — ${fmt(end,{day:'numeric',month:'long',year:'numeric'})}</div><div class="card-meta" style="margin-top:4px">${plannerOffset===0?'Tuần hiện tại':plannerOffset<0?`${Math.abs(plannerOffset)} tuần trước`:`${plannerOffset} tuần tới`}</div></div><div class="toolbar"><button class="icon-btn" data-action="week-prev">‹</button><button class="soft-btn" data-action="week-today">Hôm nay</button><button class="icon-btn" data-action="week-next">›</button></div></div><div class="week-grid">${Array.from({length:7},(_,i)=>{const d=dateAdd(start,i),arr=state.tasks.filter(t=>t.due===d);return `<div class="week-day ${d===today()?'today':''}"><div class="week-day-head"><span>${['Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7','Chủ nhật'][i]}</span><strong>${dateObj(d).getDate()}</strong></div>${arr.map(t=>`<div class="week-event ${t.completed?'done':''}" data-action="edit-task" data-id="${t.id}" title="${esc(t.title)}">${esc(t.title)}</div>`).join('')}<button class="week-add" data-action="add-task-date" data-date="${d}">＋ Thêm</button></div>`}).join('')}</div></div><div class="card" style="margin-top:16px"><div class="card-head"><div class="card-title">Gợi ý lập lịch thông minh</div><span class="card-meta">Một nguyên tắc đơn giản</span></div><div class="grid" style="grid-template-columns:repeat(3,1fr);gap:12px"><div style="background:#f7f5ff;border-radius:12px;padding:13px"><b style="font-size:11px">① Chọn MIT</b><p class="card-meta" style="line-height:1.5">Chọn tối đa 3 việc quan trọng nhất trong ngày function minutesFocused(day=today()){return state.sessions.filter(x=>x.date===day).reduce((a,x)=>a+(Number(x.minutes)||0),0)}
function completedTasksSince(days=7){const from=dateAdd(today(),-(days-1));return state.tasks.filter(t=>t.completed&&t.completedAt&&t.completedAt>=from&&t.completedAt<=today()).length}
function coachInsights(){
  const overdue=state.tasks.filter(t=>!t.completed&&t.due<today()).sort((a,b)=>a.due.localeCompare(b.due));

  const focus=minutesFocused();
  const ideas=[];
  if(overdue.length)ideas.push({icon:'🧭',title:`Gỡ ${overdue.length} việc quá hạn`,text:`Đừng cố làm bù tất cả cùng lúc. Chọn việc quan trọng nhất, đổi hạn những việc còn lại cho thực tế.`,page:'tasks',cta:'Rà soát công việc'});

}

function addBrainNote(note=null){
 const n=note||{};
 openModal(note?'Chỉnh sửa ghi chú':'Ghi chú mới',`<div class="field"><label>Tiêu đề *</label><input name="title" required maxlength="100" value="${esc(n.title||'')}" placeholder="Một ý tưởng, kiến thức hoặc điều cần nhớ"></div><div class="form-row"><div class="field"><label>Thư mục</label><select name="folder">${['Học tập','Ý tưởng','Công việc','Cuộc sống','Đọc sách','Khác'].map(x=>`<option ${x===(n.folder||'Học tập')?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Tags (ngăn cách bằng dấu phẩy)</label><input name="tags" maxlength="180" value="${esc((n.tags||[]).join(', '))}" placeholder="Aptis, C++, ý tưởng"></div></div><div class="field"><label>Nội dung *</label><textarea name="content" required rows="8" maxlength="12000" placeholder="Ghi lại bằng lời của bạn. Bạn có thể thêm ví dụ, câu hỏi và liên kết...">${esc(n.content||'')}</textarea></div><label class="milestone"><input type="checkbox" name="favorite" ${n.favorite?'checked':''}> <span>Ghim ghi chú này lên đầu</span></label>`,note?'Lưu ghi chú':'Lưu vào Second Brain',fd=>{
   const now=today(),item={id:note?.id||uid(),title:fd.get('title').trim(),folder:fd.get('folder'),tags:fd.get('tags').split(',').map(x=>x.trim()).filter(Boolean).slice(0,10),content:fd.get('content').trim(),favorite:fd.get('favorite')==='on',created:note?.created||now,updated:now};
   if(note)state.brainNotes=state.brainNotes.map(x=>x.id===note.id?item:x);else state.brainNotes.unshift(item);
   if(!note)award(`brain-note-${item.id}`,5,'Một ý tưởng đã được lưu giữ!');save();closeModal();render();toast('Đã lưu vào Second Brain.');
 },true);
}
function renderBrain(){

 if(brainQuery)notes=notes.filter(n=>`${n.title} ${n.content} ${(n.tags||[]).join(' ')} ${n.folder}`.toLowerCase().includes(brainQuery.toLowerCase()));

av" data-id="${n.id}">${n.favorite?'★':'☆'}</button><button data-action="copy-note" data-id="${n.id}">⧉</button><button data-action="delete-note" data-id="${n.id}">×</button></span></div></article>`).join('')||'<div class="empty" style="grid-column:1/-1"><div class="empty-ico">🧠</div>Chưa tìm thấy ghi chú. Lưu lại một điều bạn vừa học được nhé.</div>'}</div><p class="card-meta" style="line-height:1.6;margin-top:15px">Mẹo: một ghi chú tốt thường có tiêu đề cụ thể, giải thích bằng lời của bạn, một ví dụ và tags để tìm lại.</p></div>`;

function renderSmartAnalytics(){
 const days=Array.from({length:7},(_,i)=>dateAdd(today(),i-6));
 const focus=days.map(d=>minutesFocused(d));const maxFocus=Math.max(30,...focus);
 const taskDone=completedTasksSince(7);const habits7=state.habits.reduce((sum,h)=>sum+days.filter(d=>habitDone(h,d)).length,0);
 const possible=state.habits.length*7;const habitRate=possible?Math.round(habits7/possible*100):0;
 const totalFocus=state.sessions.reduce((a,s)=>a+(Number(s.minutes)||0),0);
 const completed=state.tasks.filter(t=>t.completed).length;const total=state.tasks.length;
 const areas=[...new Set(state.tasks.map(t=>t.area||'Khác'))].map(area=>({area,count:state.tasks.filter(t=>(t.area||'Khác')===area&&t.completed).length})).sort((a,b)=>b.count-a.count).slice(0,5);
 const goalAvg=state.goals.length?Math.round(state.goals.reduce((a,g)=>a+(Number(g.progress)||0),0)/state.goals.length):0;

async function shareCoachContext(){
 const text=coachContext();
 try{
  if(navigator.share){await navigator.share({title:'DAYMARK — Bối cảnh để nhận coaching',text});toast('Đã mở bảng chia sẻ. Bạn chọn ChatGPT nếu muốn gửi.');return;}
  if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);toast('Đã sao chép bối cảnh. Hãy dán vào ChatGPT khi bạn sẵn sàng.');return;}
  openModal('Bối cảnh DAYMARK',`<div class="field"><textarea rows="12" readonly>${esc(text)}</textarea></div>`,'Đóng',()=>closeModal(),true);
 }catch(e){toast('Chia sẻ đã được hủy hoặc không khả dụng.');}
}
async function exportBackup(){
 const payload={...state,backupVersion:2,exportedAt:new Date().toISOString()};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
 const file=new File([blob],`daymark-backup-${today()}.json`,{type:'application/json'});
 try{
  if(navigator.canShare?.({files:[file]})&&navigator.share){await navigator.share({files:[file],title:'DAYMARK backup'});toast('Đã mở bảng chia sẻ bản sao lưu.');return;}
 }catch(e){if(e.name==='AbortError')return;}
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Đã tạo file sao lưu.');
}
function claimQuest(id){
 const quest=rpgQuests().find(q=>q.id===id);if(!quest)return;
 if(!Array.isArray(state.rpg.claimed[today()]))state.rpg.claimed[today()]=[];
 if(state.rpg.claimed[today()].includes(id)){toast('Nhiệm vụ này đã nhận thưởng rồi.');return;}
 if(!quest.ok){toast('Hoàn thành điều kiện trước nhé.');return;}
 state.rpg.claimed[today()].push(id);state.rpg.coins=(state.rpg.coins||0)+quest.coins;
 award(`rpg-${today()}-${id}`,quest.xp,`Chinh phục nhiệm vụ: ${quest.title}!`);save();render();
}
function redeemReward(id){
 const reward=rewardShop.find(x=>x.id===id);if(!reward)return;
 if((state.rpg.coins||0)<reward.cost){toast('Bạn chưa có đủ xu cho phần thưởng này.');return;}
 state.rpg.coins-=reward.cost;state.rpg.redeemed.push({id:uid(),rewardId:id,name:reward.name,date:today(),cost:reward.cost});save();render();toast(`Đã đổi: ${reward.name}. Hãy tận hưởng phần thưởng!`);
}

 $$('[data-goto]').forEach(b=>b.onclick=()=>setPage(b.dataset.goto));
 $$('[data-filter]').forEach(b=>b.onclick=()=>{taskFilter=b.dataset.filter;render()});
 $$('[data-action]').forEach(el=>{el.onclick=(e)=>{const a=el.dataset.action,id=el.dataset.id;switch(a){case'add-task':addTask();break;case'add-task-date':addTask(el.dataset.date);break;case'toggle-task':toggleTask(id);break;case'edit-task':{const t=state.tasks.find(x=>x.id===id);if(t)addTask(t.due,t);break}case'delete-task':confirmBox('Xóa công việc?','Công việc này sẽ bị xóa khỏi danh sách.', 'Xóa',()=>{state.tasks=state.tasks.filter(t=>t.id!==id);save();render();toast('Đã xóa công việc.')});break;case'toggle-habit':toggleHabit(id);break;case'toggle-habit-date':toggleHabit(id,el.dataset.date);break;case'add-habit':addHabit();break;case'delete-habit':confirmBox('Xóa thói quen?','Lịch sử của thói quen này cũng sẽ bị xóa.', 'Xóa',()=>{state.habits=state.habits.filter(h=>h.id!==id);save();render()});break;case'add-goal':addGoal();break;case'edit-goal':{const g=state.goals.find(x=>x.id===id);if(g)addGoal(g);break}case'delete-goal':confirmBox('Xóa mục tiêu?','Bạn có chắc muốn xóa mục tiêu này?', 'Xóa',()=>{state.goals=state.goals.filter(g=>g.id!==id);save();render()});break;case'toggle-milestone':{const g=state.goals.find(x=>x.id===id),i=Number(el.dataset.index);if(g&&g.milestones[i]){g.milestones[i].done=el.checked;const total=g.milestones.length,done=g.milestones.filter(m=>m.done).length;if(total)g.progress=Math.max(g.progress,Math.round(done/total*100));if(el.checked)award(`milestone-${id}-${i}`,20,'Một cột mốc được chinh phục!');save();render()}break}case'add-journal':addJournal();break;case'delete-journal':confirmBox('Xóa ghi chú?','Bài nhật ký này sẽ bị xóa.', 'Xóa',()=>{state.journal=state.journal.filter(j=>j.id!==id);save();render()});break;case'week-prev':plannerOffset--;render();break;case'week-next':plannerOffset++;render();break;case'week-today':plannerOffset=0;render();break;
 case'add-note':addBrainNote();break;
 case'edit-note':{const n=state.brainNotes.find(x=>x.id===id);if(n)addBrainNote(n);break}
 case'delete-note':confirmBox('Xóa ghi chú?','Ghi chú này sẽ bị xóa khỏi Second Brain.', 'Xóa',()=>{state.brainNotes=state.brainNotes.filter(n=>n.id!==id);save();render();toast('Đã xóa ghi chú.')});break;
 case'toggle-note-fav':{const n=state.brainNotes.find(x=>x.id===id);if(n){n.favorite=!n.favorite;n.updated=today();save();render()}break}
 case'copy-note':{const n=state.brainNotes.find(x=>x.id===id);if(n&&navigator.clipboard?.writeText)navigator.clipboard.writeText(`${n.title}\n\n${n.content}`).then(()=>toast('Đã sao chép ghi chú.')).catch(()=>toast('Không thể sao chép trên trình duyệt này.'));else toast('Trình duyệt chưa hỗ trợ sao chép.');break}
 case'ask-coach':coachQuestion=$('#coachQuestionInput')?.value.trim()||'';coachReply=localCoachReply(coachQuestion);render();break;
 case'share-coach':shareCoachContext();break;
 case'coach-quick-task':{const id2=uid();state.tasks.push({id:id2,title:'Phiên tập trung 25 phút',area:'Personal',priority:'medium',due:today(),completed:false,estimate:25,created:today(),notes:'Bắt đầu bằng một bước nhỏ.'});save();setPage('tasks');toast('Đã thêm một bước nhỏ vào danh sách.');break}
 case'claim-quest':claimQuest(id);break;
 case'redeem-reward':redeemReward(id);break;
 }}
 });
 const search=$('#taskSearch');if(search)search.oninput=()=>{const pos=search.selectionStart;taskSearch=search.value;const page=$('#view');const list=$('.task-list',page);if(list){const newHtml=renderTasks();$('#view').innerHTML=newHtml;bindDynamic();const n=$('#taskSearch');n.focus();n.setSelectionRange(pos,pos)}};
 const brainSearch=$('#brainSearch');if(brainSearch)brainSearch.oninput=()=>{brainQuery=brainSearch.value;const pos=brainSearch.selectionStart;$('#view').innerHTML=renderBrain();bindDynamic();const n=$('#brainSearch');n.focus();n.setSelectionRange(pos,pos)};
 const brainFolderSelect=$('#brainFolder');if(brainFolderSelect)brainFolderSelect.onchange=()=>{brainFolder=brainFolderSelect.value;render()};
}
// Timer — deadline-based so it stays accurate when Safari backgrounds the PWA
function updateTimerDisplay(){
 if(timerRunning){timerLeft=Math.max(0,Math.ceil((timerDeadline-Date.now())/1000));if(timerLeft<=0){finishTimer();return;}}
 const d=$('#timerDisplay');if(!d)return;
 d.textContent=`${String(Math.floor(timerLeft/60)).padStart(2,'0')}:${String(timerLeft%60).padStart(2,'0')}`;
 const p=$('#timerProgress');if(p)p.style.width=(Math.max(0,(timerMode-timerLeft)/timerMode*100))+'%';
 const sub=$('#timerSub');if(sub)sub.textContent=timerRunning?'Bạn đang ở trong phiên tập trung':'Bắt đầu khi bạn đã sẵn sàng';
 const btn=$('#timerToggle');if(btn)btn.textContent=timerRunning?'Tạm dừng':'Bắt đầu tập trung';
}
function persistTimer(){state.focusTimer=timerRunning?{running:true,deadline:timerDeadline,mode:timerMode,label:'Phiên tập trung'}:{running:false,left:timerLeft,mode:timerMode};save()}
function finishTimer(){
 if(!timerRunning&&timerLeft===0)return;
 timerRunning=false;if(timerInterval)clearInterval(timerInterval);timerInterval=null;timerLeft=0;
 const runId=state.focusTimer?.runId||uid();const minutes=Math.max(1,Math.round(timerMode/60));
 if(!state.sessions.some(x=>x.id===runId)){state.sessions.push({id:runId,date:today(),minutes,label:'Phiên tập trung',time:new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})});award(`focus-${runId}`,Math.max(5,minutes),'Bạn vừa hoàn thành một phiên tập trung!');}
 state.focusTimer=null;save();updateTimerDisplay();toast('🎉 Phiên tập trung hoàn tất. Đứng dậy nghỉ một chút nhé!');if(currentPage==='focus')render();
}
function stopTimer(){
 if(timerRunning){timerLeft=Math.max(0,Math.ceil((timerDeadline-Date.now())/1000));if(timerLeft<=0){finishTimer();return;}}
 timerRunning=false;if(timerInterval)clearInterval(timerInterval);timerInterval=null;persistTimer();updateTimerDisplay();
}
function startTimer(){
 if(timerRunning){stopTimer();return;}
 if(timerLeft<=0)timerLeft=timerMode;
 timerRunning=true;timerDeadline=Date.now()+timerLeft*1000;
 state.focusTimer={running:true,deadline:timerDeadline,mode:timerMode,label:'Phiên tập trung',runId:uid()};
 save();updateTimerDisplay();if(timerInterval)clearInterval(timerInterval);timerInterval=setInterval(updateTimerDisplay,500);
}
function resetTimer(){if(timerInterval)clearInterval(timerInterval);timerInterval=null;timerRunning=false;timerLeft=timerMode;state.focusTimer={running:false,left:timerLeft,mode:timerMode};save();updateTimerDisplay()}
function restoreTimer(){
 const saved=state.focusTimer;if(!saved)return;
 timerMode=Number(saved.mode)||1500;
 if(saved.running&&Number(saved.deadline)>Date.now()){
   timerRunning=true;timerDeadline=Number(saved.deadline);timerLeft=Math.max(0,Math.ceil((timerDeadline-Date.now())/1000));
   if(timerInterval)clearInterval(timerInterval);timerInterval=setInterval(updateTimerDisplay,500);
 }else if(saved.running&&Number(saved.deadline)<=Date.now()){
   timerRunning=true;timerDeadline=Number(saved.deadline);timerLeft=0;finishTimer();
 }else{timerRunning=false;timerLeft=Math.max(0,Number(saved.left)||timerMode)}
}
function bindGlobal(){
 $('#mainNav').onclick=e=>{const b=e.target.closest('button[data-page]');if(b)setPage(b.dataset.page)};
 $('#globalAdd').onclick=()=>addTask();
 $('#searchBtn').onclick=()=>{setPage('tasks');taskFilter='all';render();$('#taskSearch')?.focus()};
 $('#themeBtn').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';save();render();toast(state.theme==='dark'?'Đã bật giao diện tối.':'Đã bật giao diện sáng.');};
 $('#view').addEventListener('click',e=>{if(e.target.matches('[data-minutes]')){if(timerRunning)return;timerMode=Number(e.target.dataset.minutes)*60;timerLeft=timerMode;state.focusTimer={running:false,left:timerLeft,mode:timerMode};save();$$('[data-minutes]').forEach(b=>b.classList.toggle('active',b===e.target));updateTimerDisplay()}if(e.target.id==='timerToggle')startTimer();if(e.target.id==='timerReset')resetTimer()});
 $('#view').addEventListener('click',e=>{if(e.target.id==='saveName'){const v=$('#nameInput').value.trim();if(v){state.userName=v;save();render();toast('Đã cập nhật hồ sơ.')}}if(e.target.id==='exportData'){exportBackup()}});
 $('#view').addEventListener('change',e=>{if(e.target.id==='importData'){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!data||!Array.isArray(data.tasks)||!Array.isArray(data.habits)||!Array.isArray(data.goals))throw new Error('invalid');confirmBox('Khôi phục dữ liệu?','Dữ liệu hiện tại sẽ được thay thế bằng nội dung trong file sao lưu.', 'Khôi phục',()=>{state={...defaults(),...data,rpg:{...defaults().rpg,...(data.rpg||{})}};if(!Array.isArray(state.brainNotes))state.brainNotes=[];save();setPage('dashboard');toast('Khôi phục dữ liệu thành công.')})}catch(err){toast('File không đúng định dạng DAYMARK.')}};reader.readAsText(f)}});
 $('#view').addEventListener('click',e=>{if(e.target.id==='resetData')confirmBox('Bắt đầu lại từ đầu?','Toàn bộ dữ liệu hiện tại sẽ bị thay thế bằng dữ liệu mẫu. Hãy xuất bản sao lưu trước nếu cần.', 'Làm mới',()=>{state=defaults();save();setPage('dashboard');toast('Đã khôi phục dữ liệu mẫu.')})});
}
function boot(){
 document.body.classList.toggle('dark',state.theme==='dark');
 if('serviceWorker' in navigator && location.protocol!=='file:'){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
 if(state.lastVisit!==today()){state.lastVisit=today();save()}
 bindGlobal();restoreTimer();render();
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&timerRunning)updateTimerDisplay()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();const tag=document.activeElement?.tagName;if(['INPUT','TEXTAREA','SELECT'].includes(tag))return;if(e.key.toLowerCase()==='n'){e.preventDefault();addTask()}if(e.key==='/'){e.preventDefault();setPage('tasks');taskFilter='all';render();$('#taskSearch')?.focus()}})
}
boot();
})();
</script>
